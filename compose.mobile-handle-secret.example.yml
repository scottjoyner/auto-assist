# Opt-in API-only overlay. Provision the host file separately, mode 0600.
# Compose refuses to create a missing host file. Never pass the key in a CLI argument.
services:
  api:
    environment:
      KIPNERTER_MOBILE_MODEL_HANDLE_SECRET_FILE: /run/secrets/kipnerter_mobile_model_handle
    volumes:
      - type: bind
        source: ${KIPNERTER_MOBILE_HANDLE_KEY_PATH:?Set absolute path to an existing private key file}
        target: /run/secrets/kipnerter_mobile_model_handle
        read_only: true
        bind:
          create_host_path: false
