name: Task writer source census (research HOLD)
on:
  pull_request:
    branches:
      - main
      - feat/scoped-machine-heartbeat-finalization-20261103
      - research/machine-auth-execution-combined-20261103
    paths:
      - scripts/audit_task_writer_sites.py
      - tests/test_task_writer_census.py
      - docs/research/TASK_WRITER_CENSUS_20261103.md
      - .github/workflows/task-writer-census-research.yml
  workflow_dispatch:
jobs:
  static-writer-discovery-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal isolated test tools
        run: python -m pip install pytest ruff
      - name: Compile and lint scanner
        run: |
          python -m py_compile scripts/audit_task_writer_sites.py tests/test_task_writer_census.py
          ruff check --ignore I001,E501,UP012,UP018,UP035,UP037,UP045 scripts/audit_task_writer_sites.py tests/test_task_writer_census.py
      - name: Verify conservative classification and HOLD semantics
        run: python -m pytest --noconftest -q tests/test_task_writer_census.py
      - name: Emit nonauthoritative summary
        run: python scripts/audit_task_writer_sites.py --summary-only
