name: Runtime Projection Review Evidence (No Apply)

on:
  push:
    branches:
      - experiment/runtime-approval-evidence-freshness-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint only
        run: python -m pip install 'ruff>=0.6,<1'
      - name: Exercise stale-source and replay rejection
        run: python -m unittest discover -s tests -p 'test_runtime_projection_review_preflight.py' -q
      - name: Lint completely offline review gate
        run: ruff check scripts/runtime-projection-review-preflight.py tests/test_runtime_projection_review_preflight.py
      - name: Verify review tool has no apply or dispatch authority
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('scripts/runtime-projection-review-preflight.py').read_text()
          for key in (
              '"can_auto_renew": False',
              '"can_apply": False',
              '"can_dispatch": False',
              '"operator_approval_minted": False',
              '"new_canonical_generation_created": False',
              '"source_attested": False',
          ):
              assert key in source, key
          for prohibited in ("GraphDatabase", "execute_write(", "subprocess", "urllib.request", "os.system(", "requests.post"):
              assert prohibited not in source, prohibited
          print('Unsigned review cannot authorize or renew; no network or Neo4j dependencies.')
          PY
