name: Neo4j native backup metadata parser regression (research HOLD)
on:
  pull_request:
    branches:
      - main
      - research/backup-loopback-readiness-20261103
    paths:
      - src/assistx/neo4j_backup_verification.py
      - tests/test_backup_native_metadata_regression.py
      - .github/workflows/neo4j-backup-native-table-guard-research.yml
      - docs/research/NAS_NEO4J_NATIVE_BACKUP_DISCOVERY_20261103.md
  workflow_dispatch:
jobs:
  exact-native-metadata-parser-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal source test dependencies
        run: python3 -m pip install pytest ruff
      - name: Compile and lint native metadata parser
        run: |
          python3 -m py_compile src/assistx/neo4j_backup_verification.py \
            tests/test_backup_native_metadata_regression.py
          python3 -m ruff check --ignore I001,E501,UP012,UP018,UP035,UP037,UP045 \
            src/assistx/neo4j_backup_verification.py \
            tests/test_backup_native_metadata_regression.py
      - name: Verify 5.x native table and JSON boolean fail-closed contracts
        env:
          PYTHONPATH: src
        run: |
          python3 -m pytest --noconftest -q \
            tests/test_backup_native_metadata_regression.py \
            tests/test_neo4j_backup_verification.py
  disposable-neo4j-writer-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated project test dependencies
        run: python3 -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Existing backup chain and physical disposable Neo4j regressions
        env:
          TEST_NEO4J_IMAGE: neo4j:5-enterprise
        run: |
          python3 -m pytest -q tests/test_backup_native_metadata_regression.py \
            tests/test_neo4j_backup_verification.py \
            tests/test_review_orphan_audit_neo4j.py \
            tests/test_review_atomic_approval_neo4j.py \
            tests/test_operator_review_transition_neo4j.py \
            tests/test_legacy_task_writer_guard_neo4j.py \
            tests/test_legacy_task_completion_neo4j.py \
            tests/test_legacy_task_maintenance_neo4j.py \
            tests/test_legacy_intent_cancel_neo4j.py \
            tests/test_scoped_machine_claim_neo4j.py \
            tests/test_scoped_machine_execution_neo4j.py \
            tests/test_recovery_canary.py
