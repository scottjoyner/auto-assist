name: Fleet SSH LAN catalog witness (synthetic only)

on:
  pull_request:
    paths:
      - scripts/fleet_ssh_lan_model_readonly_witness.py
      - tests/test_fleet_ssh_lan_model_readonly_witness.py
      - scripts/fleet_signed_ssh_docker_catalog_canary.py
      - tests/test_fleet_signed_ssh_docker_catalog_canary.py
      - .github/workflows/fleet-ssh-lan-readonly-witness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-ssh-catalog-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out without retained credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Install offline test runner
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Validate SSH-LAN and signed Docker-private bridge contracts without live probes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile scripts/fleet_ssh_lan_model_readonly_witness.py tests/test_fleet_ssh_lan_model_readonly_witness.py scripts/fleet_signed_ssh_docker_catalog_canary.py tests/test_fleet_signed_ssh_docker_catalog_canary.py
          python -m pytest --noconftest -q -p no:cacheprovider tests/test_fleet_ssh_lan_model_readonly_witness.py tests/test_fleet_signed_ssh_docker_catalog_canary.py
