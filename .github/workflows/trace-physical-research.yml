name: trace-physical-research (synthetic guards only)

on:
  pull_request:
    paths:
      - "src/assistx/trace_durable_ledger_research.py"
      - "tests/probe_trace_physical_lifecycle_526.py"
      - "tests/probe_trace_transport_blackhole_526.py"
      - "tests/test_trace_durable_ledger_research.py"
      - "tests/test_trace_physical_probe_guards.py"
      - "docs/TRACE_PHYSICAL_LIFECYCLE_RESEARCH_20261009.md"
      - ".github/workflows/trace-physical-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-physical-research-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repo dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Synthetic witness and unsafe-target negative tests
        run: |
          python -m pytest -q \
            tests/test_trace_durable_ledger_research.py \
            tests/test_trace_physical_probe_guards.py
      # Never automatically start Docker/Neo4j on hosted CI. Physical evidence
      # is separately run in the exact inspected, disposable 5.26.30 fixture.
      # Green synthetic checks do NOT authorize a distributed physical fence.
