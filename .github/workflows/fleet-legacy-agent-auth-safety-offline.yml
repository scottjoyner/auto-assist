name: Fleet legacy agent credential and backoff safety (synthetic HOLD)

on:
  pull_request:
    paths:
      - src/assistx/fleet_node_agent.py
      - tests/test_fleet_agent_auth_denial_backoff.py
      - tests/test_fleet_node_privileged_transport.py
      - tests/test_fleet_node_lmstudio_auth.py
      - tests/test_fleet_node_lmstudio_auth_loopback.py
      - docs/FLEET_NODE_LEGACY_HTTP_DENIAL_CONTAINMENT_20261108.md
      - .github/workflows/fleet-legacy-agent-auth-safety-offline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-auth-denial-containment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install the repository's existing test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt
      - name: Prove auth-denial backoff and protected transport with only synthetic or loopback HTTP
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile src/assistx/fleet_node_agent.py tests/test_fleet_agent_auth_denial_backoff.py tests/test_fleet_node_privileged_transport.py tests/test_fleet_node_lmstudio_auth.py tests/test_fleet_node_lmstudio_auth_loopback.py
          python -m pytest --noconftest -q -p no:cacheprovider tests/test_fleet_agent_auth_denial_backoff.py tests/test_fleet_node_privileged_transport.py tests/test_fleet_node_lmstudio_auth.py tests/test_fleet_node_lmstudio_auth_loopback.py
