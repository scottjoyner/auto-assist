name: PR38 mobile runtime catalog wiring

on:
  push:
    branches:
      - agent/kipnerter-mobile-agent-bridge

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kipnerter-mobile-agent-bridge
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply mobile runtime catalog patch
        run: python scripts/pr38-mobile-runtime-catalog-patch.py
      - name: Verify focused gateway contracts
        env:
          BASIC_AUTH_USER: neo4j
          BASIC_AUTH_PASS: test-only
        run: |
          python -m py_compile src/assistx/mobile_agent_routes.py tests/test_mobile_runtime_catalog.py
          bash -n scripts/configure-kipnerter-tailnet-serve.sh
          bash -n scripts/verify-kipnerter-tailnet-gateway.sh
          git diff --check
          pytest -q \
            tests/test_mobile_runtime_catalog.py \
            tests/test_mobile_agent_routes.py \
            tests/test_kipnerter_gateway_wiring.py \
            tests/test_hermes_router_credentials.py
      - name: Commit clean implementation
        run: |
          set -euo pipefail
          rm -f scripts/pr38-mobile-runtime-catalog-patch.py .github/workflows/pr38-mobile-runtime-catalog-wire.yml
          git add -A
          git diff --cached --check
          git config user.name "kipnerter-runtime-catalog-bot"
          git config user.email "kipnerter-runtime-catalog-bot@users.noreply.github.com"
          git -c commit.gpgsign=false commit --no-verify -m "feat(kipnerter): expose sanitized mobile runtime catalog"
          git push origin HEAD:agent/kipnerter-mobile-agent-bridge
