name: P0 verified-user gateway isolated gate

on:
  pull_request:
    paths:
      - "src/assistx/p0_oidc_gateway.py"
      - "src/assistx/api.py"
      - "tests/test_p0_oidc_gateway.py"
      - ".github/workflows/p0-verified-user-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-identity:
    name: P0 isolated identity tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned-range lightweight test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'fastapi>=0.115.0,<1' 'httpx>=0.27.0,<0.29' \
            'cryptography>=43.0.0,<46' 'pytest>=8.3,<10' 'ruff>=0.6'
      - name: Compile default-off gateway and existing API entrypoint
        run: |
          python -m py_compile src/assistx/p0_oidc_gateway.py src/assistx/api.py
      - name: Lint isolated identity boundary
        run: |
          ruff check src/assistx/p0_oidc_gateway.py tests/test_p0_oidc_gateway.py
      - name: Run isolated cryptographic and ASGI tests (no services)
        run: |
          python -m pytest --noconftest -q --disable-warnings tests/test_p0_oidc_gateway.py
