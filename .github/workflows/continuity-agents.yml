name: continuity-agents

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile failover agents
        run: |
          python -m py_compile \
            src/assistx/continuity_node_agent.py \
            src/assistx/continuity_replicator.py \
            tests/test_continuity_node_agent.py \
            tests/test_continuity_replicator.py

      - name: Lint failover agents
        run: |
          ruff check --ignore I001,E501,F401,B023,UP012,UP018 \
            src/assistx/continuity_node_agent.py \
            src/assistx/continuity_replicator.py \
            tests/test_continuity_node_agent.py \
            tests/test_continuity_replicator.py

      - name: Test failover agents
        run: |
          pytest -q \
            tests/test_continuity_node_agent.py \
            tests/test_continuity_replicator.py
