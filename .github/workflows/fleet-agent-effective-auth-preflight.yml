name: Fleet-node effective auth preflight
on:
  pull_request:
    branches:
      - main
      - feat/fleet-admission-preflight-20261101
      - fix/fleet-node-agent-readonly-preflight-20261102
    paths:
      - scripts/fleet_node_readiness_preflight.py
      - tests/test_fleet_node_readiness_preflight.py
      - .github/workflows/fleet-agent-effective-auth-preflight.yml
  push:
    branches:
      - fix/fleet-effective-credential-readonly-20261103
    paths:
      - scripts/fleet_node_readiness_preflight.py
      - tests/test_fleet_node_readiness_preflight.py
      - .github/workflows/fleet-agent-effective-auth-preflight.yml
  workflow_dispatch:

jobs:
  read-only-effective-auth:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install testing tools
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify preflight source compiles
        run: |
          python -m py_compile scripts/fleet_node_readiness_preflight.py tests/test_fleet_node_readiness_preflight.py
      - name: Blocking correctness lint
        # Preserve the parent branch's preexisting compact test style.
        run: |
          ruff check --ignore I001,E501,E701,E702,UP012,UP018,UP037,UP045 \
            scripts/fleet_node_readiness_preflight.py tests/test_fleet_node_readiness_preflight.py
      - name: Fail-closed agent credential and chat-role tests
        run: pytest -q tests/test_fleet_node_readiness_preflight.py
