name: Fleet node source witness (synthetic non-admission)

on:
  pull_request:
    paths:
      - scripts/fleet_node_source_witness.py
      - tests/test_fleet_node_source_witness.py
      - .github/workflows/fleet-node-source-witness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-hold-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out without retained credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Install isolated test runner
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Assert read-only witness always holds
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile scripts/fleet_node_source_witness.py tests/test_fleet_node_source_witness.py
          # This stand-alone stdlib witness must not import the full AssistX conftest.
          python -m pytest --noconftest -q -p no:cacheprovider tests/test_fleet_node_source_witness.py
