name: rc2-security-custody

on:
  pull_request:
    paths:
      - "scripts/rc2-security-preflight.py"
      - "tests/test_rc2_security_preflight.py"
      - ".github/workflows/rc2-security-custody.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-only-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify no-secret-content synthetic checks
        run: |
          python -m pip install pytest
          python -m py_compile scripts/rc2-security-preflight.py tests/test_rc2_security_preflight.py
          pytest -q tests/test_rc2_security_preflight.py

  custody-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Enforce metadata-only RC2 release hold
        run: |
          python scripts/rc2-security-preflight.py
