name: Legacy intent-cancellation shared lock (research HOLD)
on:
  pull_request:
    branches:
      - main
      - research/task-writer-census-20261103
    paths:
      - src/assistx/legacy_intent_cancel.py
      - src/assistx/api.py
      - src/assistx/intent_orchestrator.py
      - tests/test_legacy_intent_cancel.py
      - tests/test_legacy_intent_cancel_neo4j.py
      - tests/test_scoped_machine_claim_neo4j.py
      - .github/workflows/legacy-intent-cancel-fence-research.yml
  workflow_dispatch:
jobs:
  synthetic-intent-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile and lint new guard and regression tests
        run: |
          python -m py_compile src/assistx/legacy_intent_cancel.py \
            src/assistx/api.py src/assistx/intent_orchestrator.py \
            tests/test_legacy_intent_cancel.py tests/test_legacy_intent_cancel_neo4j.py
          ruff check --ignore I001,E501,UP012,UP018,UP035,UP037,UP045 \
            src/assistx/legacy_intent_cancel.py \
            tests/test_legacy_intent_cancel.py tests/test_legacy_intent_cancel_neo4j.py
      - name: Deny-by-default cancellation and existing Intent regression
        run: |
          python -m pytest -q tests/test_legacy_intent_cancel.py \
            tests/test_intent_orchestrator.py tests/test_scoped_machine_claim.py \
            tests/test_scoped_machine_execution.py tests/test_scoped_machine_poll.py
  disposable-neo4j-intent-claim-race:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Real disposable Neo4j claim/cancel/execution contention
        env:
          TEST_NEO4J_IMAGE: neo4j:5-enterprise
        run: |
          python -m pytest -q tests/test_legacy_intent_cancel_neo4j.py \
            tests/test_scoped_machine_claim_neo4j.py \
            tests/test_scoped_machine_execution_neo4j.py
