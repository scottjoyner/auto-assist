name: LFM3 server-slot overlap preflight (non-admitting)

on:
  pull_request:
    paths:
      - scripts/lfm3_server_slot_overlap_preflight.py
      - tests/test_lfm3_server_slot_overlap_preflight.py
      - .github/workflows/lfm3-server-slot-overlap-nonadmitting.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-slot-interpretation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out without retaining GitHub credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Install only standalone test harness
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Assert physical overlap never authorizes Tasks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m ast scripts/lfm3_server_slot_overlap_preflight.py > /dev/null
          python -m pytest --noconftest -q -p no:cacheprovider tests/test_lfm3_server_slot_overlap_preflight.py
