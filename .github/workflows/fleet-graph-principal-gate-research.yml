name: Fleet graph principal separation gate (research HOLD)
on:
  pull_request:
    branches:
      - main
      - research/review-orphan-audit-20261103
    paths:
      - scripts/read_only_fleet_graph_principals.py
      - tests/test_fleet_graph_principal_census.py
      - docs/research/FLEET_GRAPH_PRINCIPAL_SEPARATION_20261103.md
      - .github/workflows/fleet-graph-principal-gate-research.yml
  workflow_dispatch:
jobs:
  source-only-identity-and-redaction:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated source test requirements
        run: python -m pip install pytest ruff
      - name: Compile and lint research gate
        run: |
          python -m py_compile scripts/read_only_native_graph_privileges.py \
            scripts/read_only_fleet_graph_principals.py \
            tests/test_fleet_graph_principal_census.py \
          ruff check --ignore I001,E501,UP012,UP018,UP035,UP037,UP045 \
            scripts/read_only_fleet_graph_principals.py \
            tests/test_fleet_graph_principal_census.py \
      - name: Prove fixed allowlist, immutable pins, HOLD and redacted failures
        run: |
          pytest --noconftest -q tests/test_fleet_graph_principal_census.py \
            tests/test_read_only_native_graph_privileges.py
  disposable-neo4j-prior-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated project test requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Prior graph authority and recovery regressions (no new roles)
        env:
          TEST_NEO4J_IMAGE: neo4j:5-enterprise
        run: |
          pytest -q tests/test_review_orphan_audit_neo4j.py \
            tests/test_review_atomic_approval_neo4j.py \
            tests/test_operator_review_transition_neo4j.py \
            tests/test_legacy_task_writer_guard_neo4j.py \
            tests/test_legacy_task_completion_neo4j.py \
            tests/test_legacy_task_maintenance_neo4j.py \
            tests/test_legacy_intent_cancel_neo4j.py \
            tests/test_scoped_machine_claim_neo4j.py \
            tests/test_scoped_machine_execution_neo4j.py \
            tests/test_recovery_canary.py
