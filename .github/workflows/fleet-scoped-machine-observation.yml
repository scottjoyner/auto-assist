name: Scoped machine Task observation (deny by default)
on:
  pull_request:
    branches:
      - main
      - fix/fleet-effective-credential-readonly-20261103
      - feat/fleet-scoped-machine-observation-20261103
      - feat/scoped-machine-heartbeat-finalization-20261103
    paths:
      - src/assistx/api.py
      - src/assistx/scoped_machine_poll.py
      - tests/test_scoped_machine_poll.py
      - tests/test_machine_operator_isolation.py
      - tests/test_scoped_machine_claim_neo4j.py
      - tests/test_scoped_machine_execution_neo4j.py
      - tests/conftest.py
      - .github/workflows/fleet-scoped-machine-observation.yml
  push:
    branches:
      - feat/fleet-scoped-machine-observation-20261103
    paths:
      - src/assistx/api.py
      - src/assistx/scoped_machine_poll.py
      - tests/test_scoped_machine_poll.py
      - tests/test_machine_operator_isolation.py
      - tests/test_scoped_machine_claim_neo4j.py
      - tests/test_scoped_machine_execution_neo4j.py
      - tests/conftest.py
      - .github/workflows/fleet-scoped-machine-observation.yml
  workflow_dispatch:

jobs:

  combined-observer-claim-execution-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated project requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile and lint combined research tests
        run: |
          python -m py_compile tests/conftest.py tests/test_scoped_machine_claim_neo4j.py tests/test_scoped_machine_execution_neo4j.py
          ruff check --ignore I001,E501,UP012,UP018,UP035,UP037,UP045 \
            tests/test_scoped_machine_claim_neo4j.py tests/test_scoped_machine_execution_neo4j.py
      - name: Disposable Neo4j only - claim, execution and observer cross-stack
        env:
          TEST_NEO4J_IMAGE: neo4j:5-enterprise
        run: |
          pytest -q tests/test_scoped_machine_claim_neo4j.py tests/test_scoped_machine_execution_neo4j.py

  machine-observation-isolation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated project tests
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile exact source
        run: |
          python -m py_compile src/assistx/api.py src/assistx/scoped_machine_poll.py tests/test_scoped_machine_poll.py tests/test_machine_operator_isolation.py
      - name: Block semantic lint regressions
        run: |
          ruff check --ignore I001,E501,UP012,UP018,UP035,UP037,UP045 \
            src/assistx/scoped_machine_poll.py tests/test_scoped_machine_poll.py tests/test_machine_operator_isolation.py
      - name: Deny-by-default and existing auth regression suite
        run: |
          pytest -q tests/test_scoped_machine_poll.py \
            tests/test_machine_operator_isolation.py \
            tests/test_node_identity.py \
            tests/test_fleet_node_readiness_preflight.py \
            tests/test_safe_fleet_executor.py \
            tests/test_executor_security.py
