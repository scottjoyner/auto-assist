name: graphify-smoke

on:
  push:
    branches: ["agent/graphify-projection-poc"]
  pull_request:
    paths:
      - "src/assistx/repository_graph.py"
      - "src/assistx/repository_graph_query.py"
      - "scripts/graphify-smoke.py"
      - ".github/workflows/graphify-smoke.yml"

jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install AssistX and pinned Graphify
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install "graphifyy==0.9.46"

      - name: Run adapter/query tests
        run: |
          pytest -q tests/test_repository_graph.py tests/test_repository_graph_query.py

      - name: Generate real Graphify graph.json and normalize it
        env:
          PYTHONPATH: src
        run: |
          python scripts/graphify-smoke.py | tee graphify-smoke.json
          python -m json.tool graphify-smoke.json >/dev/null

      - name: Upload Graphify smoke result
        uses: actions/upload-artifact@v4
        with:
          name: graphify-smoke-result
          path: graphify-smoke.json
          if-no-files-found: error
          retention-days: 30
