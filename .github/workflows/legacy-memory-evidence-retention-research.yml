name: Task-linked MemoryItem retention (research HOLD)
on:
  pull_request:
    branches:
      - main
      - research/maintenance-writer-fence-20261103
    paths:
      - src/assistx/legacy_task_maintenance.py
      - src/assistx/maintenance.py
      - tests/test_legacy_task_maintenance.py
      - tests/test_legacy_task_maintenance_neo4j.py
      - .github/workflows/legacy-memory-evidence-retention-research.yml
  workflow_dispatch:
jobs:
  memory-evidence-source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated project requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile and lint
        run: |
          python -m py_compile src/assistx/legacy_task_maintenance.py \
            src/assistx/maintenance.py tests/test_legacy_task_maintenance.py \
            tests/test_legacy_task_maintenance_neo4j.py
          ruff check --ignore I001,E501,UP012,UP018,UP035,UP037,UP045 \
            src/assistx/legacy_task_maintenance.py \
            tests/test_legacy_task_maintenance.py \
            tests/test_legacy_task_maintenance_neo4j.py
      - name: Scheduled maintenance and memory fail-closed source tests
        run: |
          pytest -q tests/test_legacy_task_maintenance.py \
            tests/test_legacy_intent_cancel.py tests/test_intent_orchestrator.py
  disposable-neo4j-task-memory-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated project requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Real disposable Neo4j Task and memory retention
        env:
          TEST_NEO4J_IMAGE: neo4j:5-enterprise
        run: |
          pytest -q tests/test_legacy_task_maintenance_neo4j.py \
            tests/test_legacy_intent_cancel_neo4j.py \
            tests/test_scoped_machine_claim_neo4j.py \
            tests/test_scoped_machine_execution_neo4j.py
