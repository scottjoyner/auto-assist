name: LM Studio Worker Socket Lineage (Research)

on:
  push:
    branches:
      - experiment/lmstudio-physical-lineage-witness-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-process-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint only
        run: python -m pip install 'ruff>=0.6,<1'
      - name: Exercise isolated process and socket inode ownership
        run: python -m unittest discover -s tests -p 'test_lmstudio_worker_lineage.py' -q
      - name: Lint minimal observer and offline tests
        run: ruff check scripts/collect_lmstudio_worker_lineage.py tests/test_lmstudio_worker_lineage.py
      - name: Refuse inference, credentials or authority from socket lineage
        run: |
          python - <<'PY'
          from pathlib import Path
          code=Path('scripts/collect_lmstudio_worker_lineage.py').read_text()
          for flag in (
              '"gateway_forwarding_attested": False',
              '"model_loaded_inference_attested": False',
              '"source_signature_verified": False',
              '"owner_bound_request_attested": False',
              '"can_approve": False',
              '"can_dispatch": False',
          ):
              assert flag in code, flag
          for forbidden in (
              'Ed25519PrivateKey', 'GraphDatabase', 'subprocess',
              'ssh ', '/v1/chat/completions', 'requests.post',
          ):
              assert forbidden not in code, forbidden
          print('Lineage-only source, never a signed worker execution receipt.')
          PY
