name: router-auth-nonsecret-stacked-acceptance

# Read-only, pinned, synthetic composition evidence. This is NOT release approval.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/assistx/**"
      - "scripts/router_admin_probe.py"
      - "tests/**"
      - ".github/workflows/router-auth-nonsecret-stacked-acceptance.yml"

permissions:
  contents: read

jobs:
  pinned-three-way-composition:
    if: github.head_ref == 'feat/sanitized-effective-provider-catalog-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [targeted, unit, recovery-canary]
    env:
      REPAIR_PR: '291'
      PINNED_REPAIR_SHA: '925f35936343f6924a30d4c2f9af2a8d24cecf4b'
      SCRIPT_PR: '290'
      PINNED_SCRIPT_SHA: 'd69e3678b54e3b82b8e70836634810aa7ad72b0a'
      ASSISTX_RUNTIME_PROFILE: test
      ASSISTX_DEPENDENCY_MODE: compat
      BASIC_AUTH_USER: synthetic-ci
      BASIC_AUTH_PASS: synthetic-ci-only-password
      PYTHONPATH: src
    steps:
      - name: Checkout exact AssistX client migration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Pin and compose both independently owned repair drafts
        shell: bash
        run: |
          set -euo pipefail
          client_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin "refs/pull/${REPAIR_PR}/head"
          repair_sha="$(git rev-parse FETCH_HEAD)"
          test "$repair_sha" = "$PINNED_REPAIR_SHA" || { echo '::error::Repair PR #291 drifted'; exit 1; }
          git -c user.name='Unshipped Test Composition' \
              -c user.email='unshipped-test@invalid.example' \
              merge --no-commit --no-ff --no-edit FETCH_HEAD
          test -z "$(git ls-files -u)" || { echo '::error::PR #291 conflicts'; exit 1; }
          # A synthetic commit is necessary before the second merge. This is
          # contained in the disposable runner and is NEVER pushed.
          git -c user.name='Unshipped Test Composition' \
              -c user.email='unshipped-test@invalid.example' \
              commit --no-verify -m 'TEMPORARY RUNNER-ONLY: pinned repair composition'
          git fetch --no-tags origin "refs/pull/${SCRIPT_PR}/head"
          script_sha="$(git rev-parse FETCH_HEAD)"
          test "$script_sha" = "$PINNED_SCRIPT_SHA" || { echo '::error::Admin script PR #290 drifted'; exit 1; }
          git -c user.name='Unshipped Test Composition' \
              -c user.email='unshipped-test@invalid.example' \
              merge --no-commit --no-ff --no-edit FETCH_HEAD
          test -z "$(git ls-files -u)" || { echo '::error::PR #290 conflicts'; exit 1; }
          git diff --cached --check
          # Never mark the security hygiene test as xfail or deselect it.
          # Never print the contents of any tracked environment snapshot.
          printf 'client=%s\nrepair=%s\nscripts=%s\n' "$client_sha" "$repair_sha" "$script_sha"
          echo 'Isolated composition; no branch, secret, service or deployment changes.'

      - name: Install normal project dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install existing runtime and test requirements
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Scoped provider, auth, binding, output and recovery contracts
        if: matrix.suite == 'targeted'
        shell: bash
        run: |
          python -m pytest -q -m 'not integration' --disable-warnings \
            tests/test_llm_output_integrity.py \
            tests/test_free_subagent_supervisor.py \
            tests/test_fleet_routing_matrix_import.py \
            tests/test_kipnerter_gateway_deploy_preflight.py \
            tests/test_system_one_receipt.py \
            tests/test_template_inheritance_contract.py \
            tests/test_repository_source_binding.py \
            tests/test_router_provider_inventory_portable.py \
            tests/test_router_effective_cross_repo_fixture.py \
            tests/test_router_admin_script_probe.py \
            tests/test_router_admin_proxy_contract.py \
            tests/test_control_room.py

      - name: Full unchanged non-integration unit suite (credential gate NOT waived)
        if: matrix.suite == 'unit'
        run: python -m pytest -q -m 'not integration' --ignore=tests/integration

      - name: Disposable Neo4j recovery canary
        if: matrix.suite == 'recovery-canary'
        run: |
          python -m pytest -q \
            tests/test_recovery_canary.py \
            tests/test_recovery_island.py \
            tests/test_recovery_island_hardening.py
