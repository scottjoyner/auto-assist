name: rc2-credential-consumer-inventory

on:
  pull_request:
    paths:
      - "scripts/rc2-credential-consumer-inventory.py"
      - "tests/test_rc2_credential_consumer_inventory.py"
      - ".github/workflows/rc2-credential-consumer-inventory.yml"

permissions:
  contents: read

jobs:
  synthetic-redaction:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify redacted report contract without Docker or credentials
        run: |
          python -m pip install pytest
          python -m py_compile scripts/rc2-credential-consumer-inventory.py tests/test_rc2_credential_consumer_inventory.py
          python -m pytest --noconftest -q tests/test_rc2_credential_consumer_inventory.py
