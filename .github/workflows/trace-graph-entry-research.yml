name: Trace graph-entry research (offline only)

on:
  pull_request:
    paths:
      - 'tests/trace_graph_entry*.py'
      - 'tests/trace_fencing_term*.py'
      - 'tests/trace_etcd_*.py'
      - 'tests/trace_graph_stable_identity_research.py'
      - 'tests/trace_graph_http_ingress_research.py'
      - 'tests/test_trace_graph_http_ingress_research.py'
      - 'tests/test_trace_admission_retry_reconciliation.py'
      - 'tests/test_trace_graph_entry*.py'
      - 'tests/test_trace_fencing_term*.py'
      - 'tests/test_trace_etcd_*.py'
      - 'tests/probe_trace_entry*.py'
      - 'tests/probe_trace_fencing*.py'
      - 'tests/probe_trace_etcd_*.py'
      - 'tests/test_trace_bolt_topology_readonly.py'
      - 'tests/trace_disposable_task_broker.py'
      - 'tests/trace_disposable_task_worker.py'
      - 'tests/probe_trace_isolated_task_broker.py'
      - 'tests/test_trace_isolated_task_broker.py'
      - 'tests/trace_task_read_broker_client_research.py'
      - 'tests/test_trace_task_read_broker_client.py'
      - 'tests/test_trace_task_policy_projection_negative.py'
      - 'tests/test_trace_task_policy_projection_parity.py'
      - 'tests/test_trace_graph_consumer_census.py'
      - 'tests/trace_disposable_raft_http.py'
      - 'tests/trace_disposable_joined_bootstrap.py'
      - 'tests/trace_disposable_joined_raft_worker.py'
      - 'tests/trace_disposable_joined_quorum_loss.py'
      - 'tests/trace_disposable_separate_policy_writer.py'
      - 'tests/trace_disposable_writer_unauth.py'
      - 'tests/test_trace_disposable_separate_policy_writer.py'
      - 'tests/test_trace_three_host_split_writer_guards.py'
      - 'tests/test_trace_three_host_joined_minority_guards.py'
      - 'tests/test_trace_joined_closure_negative.py'
      - 'docs/TRACE_JOINED_CLOSURE_NEGATIVES_20261011.md'
      - 'docs/TRACE_REAL_THREE_HOST_SPLIT_WRITER_20261011.md'
      - 'docs/TRACE_SEPARATE_POLICY_WRITER_20261011.md'
      - 'tests/test_trace_joined_disposable_raft_broker.py'
      - 'docs/TRACE_JOINED_RAFT_ISOLATED_TASK_BROKER_20261011.md'
      - 'docs/TRACE_NEO4J_CONSUMER_CENSUS_20261011.md'
      - 'tests/probe_trace_quorum_neo4j*.py'
      - 'tests/test_trace_quorum_neo4j*.py'
      - '.github/workflows/trace-graph-entry-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-offline:
    name: Graph entry negative tests — no Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test tooling
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=41,<49' 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
      - name: Compile research-only modules
        run: |
          python -m compileall -q tests/trace_graph_entry_research.py tests/trace_graph_entry_guarded.py tests/trace_graph_entry_research_journal.py tests/trace_graph_entry_metadata.py tests/trace_fencing_term_authority_research.py tests/trace_etcd_quorum_fence_research.py tests/trace_etcd_graph_admission_research.py tests/trace_etcd_bearer_rbac_research.py tests/trace_etcd_policy_writer_research.py tests/trace_graph_stable_identity_research.py tests/trace_graph_http_ingress_research.py tests/trace_graph_consumer_census.py tests/trace_disposable_raft_http.py tests/trace_disposable_joined_bootstrap.py tests/trace_disposable_joined_raft_worker.py tests/trace_disposable_joined_quorum_loss.py tests/trace_disposable_separate_policy_writer.py tests/trace_disposable_writer_unauth.py
      - name: Run offline denial and journal tests
        run: |
          python -m pytest --noconftest -q \
            tests/test_trace_graph_entry_research.py \
            tests/test_trace_graph_entry_guarded.py \
            tests/test_trace_graph_entry_metadata.py \
            tests/test_trace_graph_entry_three_party_guards.py \
            tests/test_trace_fencing_term_authority_research.py \
            tests/test_trace_fencing_physical_guards.py \
            tests/test_trace_etcd_quorum_fence_research.py \
            tests/test_trace_etcd_three_hosts_guards.py \
            tests/test_trace_etcd_graph_admission_research.py \
            tests/test_trace_quorum_neo4j_physical_guards.py \
            tests/test_trace_etcd_bearer_rbac_research.py \
            tests/test_trace_etcd_policy_writer_research.py \
            tests/test_trace_admission_retry_reconciliation.py \
            tests/test_trace_graph_http_ingress_research.py \
            tests/test_trace_bolt_topology_readonly.py \
            tests/test_trace_isolated_task_broker.py \
            tests/test_trace_task_read_broker_client.py \
            tests/test_trace_task_policy_projection_negative.py \
            tests/test_trace_task_policy_projection_parity.py \
            tests/test_trace_graph_consumer_census.py \
            tests/test_trace_joined_disposable_raft_broker.py \
            tests/test_trace_disposable_separate_policy_writer.py \
            tests/test_trace_three_host_split_writer_guards.py \
            tests/test_trace_three_host_joined_minority_guards.py \
            tests/test_trace_joined_closure_negative.py
      - name: Verify physical probes remain manual-only
        run: |
          python -m compileall -q tests/probe_trace_entry_network_isolation.py tests/probe_trace_entry_pg_neo_smoke.py tests/probe_trace_entry_three_party.py tests/probe_trace_fencing_two_primaries.py tests/probe_trace_etcd_three_hosts.py tests/probe_trace_quorum_neo4j_physical.py tests/probe_trace_etcd_rbac_physical.py tests/probe_trace_etcd_ack_loss.py tests/probe_trace_bolt_topology_readonly.py
          python - <<'PY'
          from pathlib import Path
          a = Path('tests/probe_trace_entry_network_isolation.py').read_text()
          b = Path('tests/probe_trace_entry_pg_neo_smoke.py').read_text()
          assert 'EXPLICIT_NETWORK_RESEARCH_OPT_IN_REQUIRED' in a
          assert 'EXPLICIT_PG_NEO_RESEARCH_OPT_IN_REQUIRED' in b
          assert '"production_authority": False' in a
          c = Path('tests/probe_trace_entry_three_party.py').read_text()
          assert 'EXPLICIT_THREE_PARTY_OPT_IN_REQUIRED' in c
          assert '"--network", "none"' in c
          assert '"signed_append_only_custody": False' in c
          assert '"production_authority": False' in b
          d = Path('tests/probe_trace_fencing_two_primaries.py').read_text()
          assert 'EXPLICIT_TWO_PRIMARY_OPT_IN_REQUIRED' in d
          assert '"quorum_failover_proven": False' in d
          e = Path('tests/probe_trace_etcd_three_hosts.py').read_text()
          assert 'EXPLICIT_THREE_HOST_RAFT_OPT_IN_REQUIRED' in e
          assert '"operator_auto_failover": False' in e
          assert '"graph_witness_integrated": False' in e
          f = Path('tests/probe_trace_quorum_neo4j_physical.py').read_text()
          assert 'EXPLICIT_REAL_QUORUM_GRAPH_OPT_IN_REQUIRED' in f
          assert '"production_authority": False' in f
          g = Path('tests/probe_trace_etcd_rbac_physical.py').read_text()
          assert '"real_three_host_etcd_rbac": True' in g
          assert 'ASSISTX_RAFT_RBAC_RESEARCH' in e
          h = Path('tests/probe_trace_etcd_ack_loss.py').read_text()
          assert 'real_http_network_partition_injected": False' in h
          assert 'production_authority": False' in h
          assert 'ASSISTX_RAFT_ACK_LOSS_RESEARCH' in e
          topology = Path('tests/probe_trace_bolt_topology_readonly.py').read_text()
          assert 'EXPLICIT_BOUNDARY_READONLY_OPT_IN_REQUIRED' in topology
          assert 'ASSISTX_BOUNDARY_TCP_PROBE' in topology
          broker = Path('tests/probe_trace_isolated_task_broker.py').read_text()
          assert 'EXPLICIT_DISPOSABLE_GRAPH_BROKER_OPT_IN_REQUIRED' in broker
          assert 'production_authority' in broker
          physical = Path('tests/probe_trace_isolated_task_broker.py').read_text()
          assert 'ASSISTX_DISPOSABLE_RAFT_IN_BROKER' in physical
          assert '"disposable_real_raft_voters_same_host": joined' in physical
          print('Physical probes, RBAC, topology, single-host Raft and isolated broker remain opt-in; CI never runs them.')
          PY
