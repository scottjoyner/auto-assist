name: trace-execution-acceptance

on:
  pull_request:
    paths:
      - "src/assistx/trace_*"
      - "src/assistx/fleet_node_agent.py"
      - "src/assistx/api.py"
      - "tests/test_trace_*"
      - "tests/test_fleet_node_*"
      - "scripts/trace_*"
      - ".github/workflows/trace-execution-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-proof-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned repository requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile trace admission and staging harness
        run: |
          python -m py_compile \
            src/assistx/fleet_node_agent.py \
            src/assistx/trace_claim_lease.py \
            src/assistx/trace_claim_lease_api.py \
            src/assistx/trace_claim_live_executor.py \
            src/assistx/trace_execution_adapter.py \
            src/assistx/trace_segment_plan.py \
            scripts/trace_claim_lease_staging_canary.py \
            scripts/trace_claim_live_platform_smoke.py
      - name: Trace admission lint
        run: |
          ruff check --ignore UP017 \
            src/assistx/fleet_node_agent.py \
            src/assistx/trace_claim_lease.py \
            src/assistx/trace_claim_lease_api.py \
            src/assistx/trace_claim_live_executor.py \
            src/assistx/trace_segment_plan.py \
            tests/test_trace_claim_lease.py \
            tests/test_trace_claim_live_executor.py \
            tests/test_trace_http_redirect.py \
            tests/test_trace_segment_plan.py \
            tests/test_trace_execution_adapter.py \
            scripts/trace_claim_lease_staging_canary.py \
            scripts/trace_claim_live_platform_smoke.py
      - name: Fail-closed trace and recovery regression suite
        env:
          FLEET_TRACE_PROBE_ENABLED: "false"
          FLEET_TRACE_REAL_EXECUTION_ENABLED: "false"
          FLEET_UNSAFE_SHELL_TASKS_ENABLED: "false"
          ASSISTX_TRACE_LEASE_ISSUER_ENABLED: "false"
        run: |
          pytest -q \
            tests/test_trace_claim_live_executor.py \
            tests/test_trace_http_redirect.py \
            tests/test_trace_segment_plan.py \
            tests/test_trace_claim_lease.py \
            tests/test_trace_shadow_grant.py \
            tests/test_trace_execution_shadow_backup.py \
            tests/test_trace_execution_adapter.py \
            tests/test_trace_execution_shadow_paths.py \
            tests/test_fleet_node_shell_gate.py \
            tests/test_fleet_node_recovery.py \
            tests/test_safe_fleet_executor.py \
            tests/test_fleet_executor_concurrency.py
