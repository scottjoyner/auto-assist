name: Nomic source-linked issue relations (offline)

on:
  pull_request:
    paths:
      - scripts/nomicsource_issue_relations_readonly.py
      - tests/test_nomicsource_issue_relations_readonly.py
      - docs/NOMICSOURCE_ISSUE_RELATIONS_REVIEW_20261103.md
      - .github/workflows/nomicsource-issue-relations-research.yml
  push:
    branches:
      - research/nomicsource-issue-relations-20261103

permissions:
  contents: read

jobs:
  offline-issue-matcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated offline test dependencies
        run: python -m pip install --disable-pip-version-check "pytest>=8,<10" "ruff>=0.11,<1"
      - name: Compile, lint and diff-check
        run: |
          python -B -m py_compile scripts/nomicsource_issue_relations_readonly.py tests/test_nomicsource_issue_relations_readonly.py
          ruff check scripts/nomicsource_issue_relations_readonly.py tests/test_nomicsource_issue_relations_readonly.py
          git diff --check
      - name: Run 45 offline source and model-response safety tests
        run: python -B -m pytest --noconftest -q tests/test_nomicsource_issue_relations_readonly.py
      - name: Default dry run cannot call model
        run: |
          printf '%s\n' '{"schema":"assistx.open-issue-matches.input.v1","issues":[{"repo":"auto-assist","number":284,"title":"Canonical runtime projection expired and signed witnesses missing","source_url":"https://github.com/scottjoyner/auto-assist/issues/284"},{"repo":"auto-router","number":52,"title":"Canonical fleet projection expired and reattestation required","source_url":"https://github.com/scottjoyner/auto-router/issues/52"}]}' | python -B scripts/nomicsource_issue_relations_readonly.py
      - name: No model loading or production dispatch calls
        run: |
          ! grep -Eq 'models/load|models/unload|chat/completions|/api/generate|shell=True|nsenter |systemctl restart' scripts/nomicsource_issue_relations_readonly.py
          grep -F '"production_dispatch": False' scripts/nomicsource_issue_relations_readonly.py
          grep -F '"scheduled_research_authorized": False' scripts/nomicsource_issue_relations_readonly.py
