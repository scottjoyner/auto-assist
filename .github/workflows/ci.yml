name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile check
        run: |
          python -m py_compile $(find src tests scripts -name "*.py" -type f)

      - name: Lint merge-gate control modules (ruff)
        run: |
          ruff check \
            src/assistx/allocation_engine.py \
            src/assistx/control_room.py \
            src/assistx/control_room_runtime.py \
            src/assistx/diagnosis_engine.py \
            src/assistx/diagnostic_probes.py \
            src/assistx/deployment_canary.py \
            scripts/init-canary-env.py \
            scripts/reconciliation-image-bundle.py \
            scripts/validate-executor-containment.py \
            scripts/validate-external-dependencies.py \
            src/assistx/controller_runtime.py \
            src/assistx/execution_control.py \
            src/assistx/improvement_cycle.py \
            src/assistx/improvement_runtime.py \
            src/assistx/kv_cache.py \
            src/assistx/node_identity.py \
            src/assistx/recovery_control.py \
            src/assistx/recovery_runbooks.py \
            src/assistx/fleet_node_agent.py \
            src/assistx/tools/web_search.py \
            src/assistx/operations_readiness.py \
            tests/test_allocation_engine.py \
            tests/test_control_room.py \
            tests/test_control_room_runtime.py \
            tests/test_reconciliation_containment.py \
            tests/test_reconciliation_image_bundle.py \
            tests/test_diagnosis_engine.py \
            tests/test_diagnostic_probes.py \
            tests/test_deployment_canary.py \
            tests/test_controller_runtime.py \
            tests/test_execution_control.py \
            tests/test_improvement_cycle.py \
            tests/test_improvement_runtime.py \
            tests/test_kv_cache.py \
            tests/test_node_identity.py \
            tests/test_recovery_control.py \
            tests/test_recovery_runbooks.py \
            tests/test_recovery_canary.py \
            tests/test_fleet_node_kv_cache.py \
            tests/test_fleet_node_recovery.py \
            tests/test_fleet_node_shell_gate.py \
            tests/test_operations_readiness.py

      - name: Type check (mypy)
        run: |
          mypy src/assistx --ignore-missing-imports --no-error-summary || true

      - name: Run tests
        env:
          BASIC_AUTH_USER: neo4j
          BASIC_AUTH_PASS: livelongandprosper
        run: |
          pytest -q -m "not integration" --ignore=tests/integration

  recovery-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Recovery lifecycle canary
        env:
          BASIC_AUTH_USER: neo4j
          BASIC_AUTH_PASS: livelongandprosper
        run: |
          pytest -q tests/test_recovery_canary.py
