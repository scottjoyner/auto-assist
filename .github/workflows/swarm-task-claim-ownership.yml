name: Swarm Task failure and lease ownership fences
on:
  pull_request:
    branches:
      - main
      - fix/backend-completion-replay-cas-20261103
    paths:
      - src/assistx/swarm_core.py
      - src/assistx/swarm_routes.py
      - src/assistx/neo4j_client.py
      - tests/test_swarm_task_ownership_fences.py
      - tests/test_backend_completion_replay_cas.py
      - .github/workflows/swarm-task-claim-ownership.yml
  push:
    branches:
      - fix/swarm-failure-lease-ownership-20261103
    paths:
      - src/assistx/swarm_core.py
      - src/assistx/swarm_routes.py
      - src/assistx/neo4j_client.py
      - tests/test_swarm_task_ownership_fences.py
      - tests/test_backend_completion_replay_cas.py
      - .github/workflows/swarm-task-claim-ownership.yml
  workflow_dispatch:

jobs:
  isolated-swarm-ownership-and-replay-races:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and tests
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile and targeted correctness lint
        run: |
          python -m py_compile src/assistx/neo4j_client.py src/assistx/swarm_core.py src/assistx/swarm_routes.py tests/test_swarm_task_ownership_fences.py tests/test_backend_completion_replay_cas.py
          ruff check --select E4,E7,E9,F63,F7,F82 --ignore E401,E402,E741 \
            src/assistx/neo4j_client.py src/assistx/swarm_core.py src/assistx/swarm_routes.py \
            tests/test_swarm_task_ownership_fences.py tests/test_backend_completion_replay_cas.py
      - name: Disposable Neo4j and adjacent worker/recovery regressions
        env:
          TEST_NEO4J_IMAGE: neo4j:5-enterprise
        run: |
          pytest -q tests/test_swarm_task_ownership_fences.py \
            tests/test_backend_completion_replay_cas.py tests/test_swarm_phase2.py \
            tests/test_recovery_canary.py tests/test_continuous_work_safety.py \
            tests/test_fleet_node_poll_contract.py tests/test_safe_fleet_executor.py \
            tests/test_executor_security.py tests/test_node_identity.py
