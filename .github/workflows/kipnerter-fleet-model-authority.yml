name: Kipnerter Fleet Model Authority Contract

on:
  push:
    paths:
      - "src/assistx/mobile_agent_routes.py"
      - "scripts/validate_mobile_model_replica_canary.py"
      - "scripts/capture_mobile_model_replica_canary.py"
      - "scripts/bootstrap-x1-370-canary-runner.sh"
      - "scripts/bootstrap-x1-370-canary-workspace.sh"
      - "scripts/run-x1-370-live-fleet-preflight.sh"
      - "scripts/run-x1-370-fleet-canary-before.sh"
      - "scripts/run-x1-370-fleet-canary-after.sh"
      - ".github/workflows/live-fleet-replica-canary-preflight.yml"
      - ".github/workflows/kipnerter-fleet-model-authority.yml"
      - "tests/test_mobile_runtime_catalog.py"
      - "tests/test_mobile_model_replica_canary.py"
      - "tests/test_capture_mobile_model_replica_canary.py"
      - "docs/KIPNERTER_FLEET_MODEL_REPLICA_CANARY.md"
  pull_request:
    paths:
      - "src/assistx/mobile_agent_routes.py"
      - "scripts/validate_mobile_model_replica_canary.py"
      - "scripts/capture_mobile_model_replica_canary.py"
      - "scripts/bootstrap-x1-370-canary-runner.sh"
      - "scripts/bootstrap-x1-370-canary-workspace.sh"
      - "scripts/run-x1-370-live-fleet-preflight.sh"
      - "scripts/run-x1-370-fleet-canary-before.sh"
      - "scripts/run-x1-370-fleet-canary-after.sh"
      - ".github/workflows/live-fleet-replica-canary-preflight.yml"
      - ".github/workflows/kipnerter-fleet-model-authority.yml"
      - "tests/test_mobile_runtime_catalog.py"
      - "tests/test_mobile_model_replica_canary.py"
      - "tests/test_capture_mobile_model_replica_canary.py"
      - "docs/KIPNERTER_FLEET_MODEL_REPLICA_CANARY.md"
  workflow_dispatch:

jobs:
  authority-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile authority path
        run: |
          python -m py_compile \
            src/assistx/mobile_agent_routes.py \
            scripts/validate_mobile_model_replica_canary.py \
            scripts/capture_mobile_model_replica_canary.py
          bash -n scripts/bootstrap-x1-370-canary-runner.sh
          bash -n scripts/bootstrap-x1-370-canary-workspace.sh
          bash -n scripts/run-x1-370-live-fleet-preflight.sh
          bash -n scripts/run-x1-370-fleet-canary-before.sh
          bash -n scripts/run-x1-370-fleet-canary-after.sh
      - name: Run Fleet model authority contracts
        run: |
          pytest -q \
            tests/test_mobile_runtime_catalog.py \
            tests/test_mobile_model_replica_canary.py \
            tests/test_capture_mobile_model_replica_canary.py
