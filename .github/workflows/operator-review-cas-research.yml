name: Operator review compare-and-set (research HOLD)
on:
  pull_request:
    branches:
      - main
      - research/heartbeat-status-guard-20261103
    paths:
      - src/assistx/operator_review_transition.py
      - tests/test_operator_review_transition.py
      - tests/test_operator_review_transition_neo4j.py
      - docs/research/OPERATOR_REVIEW_CAS_20261103.md
      - .github/workflows/operator-review-cas-research.yml
  workflow_dispatch:
jobs:
  isolated-review-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Minimal source research tooling
        run: python -m pip install pytest ruff
      - name: Compile and lint
        run: |
          python -m py_compile src/assistx/operator_review_transition.py tests/test_operator_review_transition.py tests/test_operator_review_transition_neo4j.py
          ruff check --ignore I001,E501,UP012,UP018,UP035,UP037,UP045 src/assistx/operator_review_transition.py tests/test_operator_review_transition.py tests/test_operator_review_transition_neo4j.py
      - name: Verify source-only fail-closed review boundary
        run: python -m pytest --noconftest -q tests/test_operator_review_transition.py
  disposable-neo4j-review-cas-contention:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify real canonical lock, review CAS, and recovery compatibility
        env:
          TEST_NEO4J_IMAGE: neo4j:5-enterprise
        run: |
          python -m pytest -q tests/test_operator_review_transition_neo4j.py \
            tests/test_legacy_task_writer_guard_neo4j.py \
            tests/test_legacy_task_completion_neo4j.py \
            tests/test_legacy_task_maintenance_neo4j.py \
            tests/test_legacy_intent_cancel_neo4j.py \
            tests/test_scoped_machine_claim_neo4j.py \
            tests/test_scoped_machine_execution_neo4j.py \
            tests/test_recovery_canary.py
