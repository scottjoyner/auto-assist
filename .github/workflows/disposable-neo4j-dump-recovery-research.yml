name: Disposable Neo4j historical dump recovery (research HOLD)
on:
  pull_request:
    branches:
      - main
      - research/neo4j-cutover-preflight-20261103
    paths:
      - scripts/disposable_neo4j_dump_restore.py
      - tests/test_disposable_neo4j_dump_restore.py
      - docs/research/DISPOSABLE_NEO4J_DUMP_RECOVERY_20261103.md
      - .github/workflows/disposable-neo4j-dump-recovery-research.yml
  workflow_dispatch:
jobs:
  isolated-source-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test tools
        run: python3 -m pip install pytest ruff
      - name: Compile and lint research restore source
        run: |
          python3 -m py_compile scripts/disposable_neo4j_dump_restore.py \
            tests/test_disposable_neo4j_dump_restore.py
          python3 -m ruff check --ignore I001,E501,UP012,UP018,UP035,UP037,UP045 \
            scripts/disposable_neo4j_dump_restore.py \
            tests/test_disposable_neo4j_dump_restore.py
      - name: Verify no-production path, network/privilege isolation, RPO and redaction
        run: |
          python3 -m pytest --noconftest -q \
            tests/test_disposable_neo4j_dump_restore.py
  disposable-neo4j-writer-and-backup-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated project test requirements
        run: python3 -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Existing backup-chain parser and disposable Task recovery regressions
        env:
          TEST_NEO4J_IMAGE: neo4j:5-enterprise
        run: |
          python3 -m pytest -q tests/test_neo4j_backup_verification.py \
            tests/test_review_orphan_audit_neo4j.py \
            tests/test_review_atomic_approval_neo4j.py \
            tests/test_operator_review_transition_neo4j.py \
            tests/test_legacy_task_writer_guard_neo4j.py \
            tests/test_legacy_task_completion_neo4j.py \
            tests/test_legacy_task_maintenance_neo4j.py \
            tests/test_legacy_intent_cancel_neo4j.py \
            tests/test_scoped_machine_claim_neo4j.py \
            tests/test_scoped_machine_execution_neo4j.py \
            tests/test_recovery_canary.py
