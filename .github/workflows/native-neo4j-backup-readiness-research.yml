name: Neo4j internal backup readiness (research HOLD)
on:
  pull_request:
    branches:
      - main
      - research/dump-restorability-20261103
    paths:
      - scripts/read_only_neo4j_backup_readiness.py
      - tests/test_read_only_neo4j_backup_readiness.py
      - docs/research/NEO4J_INTERNAL_BACKUP_READINESS_20261103.md
      - .github/workflows/native-neo4j-backup-readiness-research.yml
  workflow_dispatch:
jobs:
  source-only-native-backup-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated source testing tools
        run: python3 -m pip install pytest ruff
      - name: Compile and lint backup-readiness preflight
        run: |
          python3 -m py_compile scripts/read_only_neo4j_backup_readiness.py \
            tests/test_read_only_neo4j_backup_readiness.py
          python3 -m ruff check --ignore I001,E501,UP012,UP018,UP035,UP037,UP045 \
            scripts/read_only_neo4j_backup_readiness.py \
            tests/test_read_only_neo4j_backup_readiness.py
      - name: No-production-write, image-pin, kernel socket and RPO regressions
        run: |
          python3 -m pytest --noconftest -q \
            tests/test_read_only_neo4j_backup_readiness.py
  disposable-existing-writer-and-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated project tests
        run: python3 -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Existing Enterprise backup parser and disposable Neo4j writer recovery
        env:
          TEST_NEO4J_IMAGE: neo4j:5-enterprise
        run: |
          python3 -m pytest -q tests/test_neo4j_backup_verification.py \
            tests/test_review_orphan_audit_neo4j.py \
            tests/test_review_atomic_approval_neo4j.py \
            tests/test_operator_review_transition_neo4j.py \
            tests/test_legacy_task_writer_guard_neo4j.py \
            tests/test_legacy_task_completion_neo4j.py \
            tests/test_legacy_task_maintenance_neo4j.py \
            tests/test_legacy_intent_cancel_neo4j.py \
            tests/test_scoped_machine_claim_neo4j.py \
            tests/test_scoped_machine_execution_neo4j.py \
            tests/test_recovery_canary.py
