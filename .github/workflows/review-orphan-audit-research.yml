name: Review provenance orphan census (research READ ONLY HOLD)
on:
  pull_request:
    branches:
      - main
      - research/review-atomic-outbox-20261103
    paths:
      - src/assistx/review_orphan_audit.py
      - scripts/audit_review_orphans.py
      - tests/test_review_orphan_audit.py
      - tests/test_review_orphan_audit_cli.py
      - tests/test_review_orphan_audit_neo4j.py
      - docs/research/REVIEW_ORPHAN_AUDIT_20261103.md
      - .github/workflows/review-orphan-audit-research.yml
  workflow_dispatch:
jobs:
  read-only-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal read-only audit dependencies
        run: python -m pip install pytest neo4j ruff
      - name: Compile and lint
        run: |
          python -m py_compile src/assistx/review_orphan_audit.py \
            scripts/audit_review_orphans.py tests/test_review_orphan_audit.py \
            tests/test_review_orphan_audit_cli.py \
            tests/test_review_orphan_audit_neo4j.py
          ruff check --ignore I001,E501,UP012,UP018,UP035,UP037,UP045 \
            src/assistx/review_orphan_audit.py \
            scripts/audit_review_orphans.py \
            tests/test_review_orphan_audit.py \
            tests/test_review_orphan_audit_cli.py \
            tests/test_review_orphan_audit_neo4j.py
      - name: Prove read-only bounds, redaction, HOLD and explicit opt-in
        run: |
          pytest --noconftest -q tests/test_review_orphan_audit.py \
            tests/test_review_orphan_audit_cli.py
  disposable-neo4j-provenance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated graph test requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Real disposable Neo4j orphan classifications and prior research regression
        env:
          TEST_NEO4J_IMAGE: neo4j:5-enterprise
        run: |
          pytest -q tests/test_review_orphan_audit_neo4j.py \
            tests/test_review_atomic_approval_neo4j.py \
            tests/test_operator_review_transition_neo4j.py \
            tests/test_legacy_task_writer_guard_neo4j.py \
            tests/test_legacy_task_completion_neo4j.py \
            tests/test_legacy_task_maintenance_neo4j.py \
            tests/test_legacy_intent_cancel_neo4j.py \
            tests/test_scoped_machine_claim_neo4j.py \
            tests/test_scoped_machine_execution_neo4j.py \
            tests/test_recovery_canary.py
