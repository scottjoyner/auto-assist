name: Fleet private LFM3 internal egress (synthetic, HOLD)

on:
  pull_request:
    paths:
      - scripts/fleet_lfm3_internal_egress_stage.py
      - tests/test_fleet_lfm3_internal_egress_stage.py
      - docs/FLEET_LFM3_INTERNAL_EGRESS_FENCE_20261108.md
      - .github/workflows/fleet-lfm3-internal-egress-offline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-egress-and-identity-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install offline test runner only
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Test strict network, image, model identity and cleanup denials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src:scripts
        run: |
          python -m py_compile scripts/fleet_lfm3_internal_egress_stage.py tests/test_fleet_lfm3_internal_egress_stage.py
          python -m pytest --noconftest -q -p no:cacheprovider tests/test_fleet_lfm3_internal_egress_stage.py tests/test_fleet_lfm3_namespaced_slot_gateway.py tests/test_fleet_lfm3_signed_slot_bridge_canary.py tests/test_fleet_resource_slot_ledger.py
