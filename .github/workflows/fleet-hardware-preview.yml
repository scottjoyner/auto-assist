name: Fleet hardware preview contract

on:
  pull_request:
    paths:
      - "src/assistx/fleet_hardware_preview.py"
      - "src/assistx/api_router.py"
      - "tests/test_fleet_hardware_preview.py"
      - "tests/test_fleet_hardware_route_smoke.py"
      - "tests/test_fleet_hardware_ui.mjs"
      - "static/js/fleet_hardware_preview.js"
      - "templates/fleet_hardware_evidence.html"
      - "templates/base.html"
      - "static/css/fleet_hardware_evidence.css"
      - "docs/FLEET_HARDWARE_PREVIEW.md"
      - ".github/workflows/fleet-hardware-preview.yml"
  push:
    paths:
      - "src/assistx/fleet_hardware_preview.py"
      - "src/assistx/api_router.py"
      - "tests/test_fleet_hardware_preview.py"
      - "tests/test_fleet_hardware_route_smoke.py"
      - "tests/test_fleet_hardware_ui.mjs"
      - "static/js/fleet_hardware_preview.js"
      - "templates/fleet_hardware_evidence.html"
      - "templates/base.html"
      - "static/css/fleet_hardware_evidence.css"
      - ".github/workflows/fleet-hardware-preview.yml"

permissions:
  contents: read

jobs:
  preview-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      ASSISTX_RUNTIME_PROFILE: test
      ASSISTX_DEPENDENCY_MODE: compat
      # Deliberately no ASSISTX_FLEET_HARDWARE_ROOT and no private fleet inventory.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install existing dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile new adapter
        run: python -m py_compile src/assistx/fleet_hardware_preview.py
      - name: Lint changed files
        run: |
          ruff check src/assistx/fleet_hardware_preview.py src/assistx/api_router.py tests/test_fleet_hardware_preview.py
      - name: Run isolated synthetic preview contract
        run: |
          python -m pytest -q tests/test_fleet_hardware_preview.py
      - name: Verify Jinja dashboard template parses
        run: |
          python -c "from pathlib import Path; from jinja2 import Environment; Environment().parse(Path('templates/fleet_hardware_evidence.html').read_text())"
      - name: Verify read-only operator UI behavior
        run: node --test tests/test_fleet_hardware_ui.mjs
      - name: Full AssistX application auth and route smoke
        run: python -m pytest -q tests/test_fleet_hardware_route_smoke.py
