name: Fleet hardware preview contract

on:
  pull_request:
    paths:
      - "src/assistx/fleet_hardware_preview.py"
      - "src/assistx/fleet_hardware_inspection.py"
      - "src/assistx/api_router.py"
      - "tests/test_fleet_hardware_preview.py"
      - "tests/test_fleet_hardware_inspection.py"
      - "tests/test_fleet_receipt_lab_guard.py"
      - "tests/physical/fleet_receipt_disposable_neo4j.py"
      - "templates/base.html"
      - "templates/fleet_dashboard.html"
      - "templates/fleet_hardware_evidence.html"
      - "templates/traces.html"
      - "static/css/fleet_hardware_evidence.css"
      - "static/js/fleet_hardware_preview.js"
      - "static/js/fleet_trace_evidence.js"
      - "static/js/traces.js"
      - "tests/ui/fleet_hardware_evidence.test.cjs"
      - "tests/test_fleet_hardware_route_smoke.py"
      - "docs/FLEET_HARDWARE_PREVIEW.md"
      - "docs/FLEET_HARDWARE_INSPECTION_RECEIPTS.md"
      - ".github/workflows/fleet-hardware-preview.yml"
  push:
    paths:
      - "src/assistx/fleet_hardware_preview.py"
      - "src/assistx/fleet_hardware_inspection.py"
      - "src/assistx/api_router.py"
      - "tests/test_fleet_hardware_preview.py"
      - "tests/test_fleet_hardware_inspection.py"
      - "tests/test_fleet_receipt_lab_guard.py"
      - "tests/physical/fleet_receipt_disposable_neo4j.py"
      - "templates/base.html"
      - "templates/fleet_dashboard.html"
      - "templates/fleet_hardware_evidence.html"
      - "templates/traces.html"
      - "static/css/fleet_hardware_evidence.css"
      - "static/js/fleet_hardware_preview.js"
      - "static/js/fleet_trace_evidence.js"
      - "static/js/traces.js"
      - "tests/ui/fleet_hardware_evidence.test.cjs"
      - "tests/test_fleet_hardware_route_smoke.py"
      - ".github/workflows/fleet-hardware-preview.yml"

permissions:
  contents: read

jobs:
  preview-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      ASSISTX_RUNTIME_PROFILE: test
      ASSISTX_DEPENDENCY_MODE: compat
      # Deliberately no ASSISTX_FLEET_HARDWARE_ROOT and no private fleet inventory.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install existing dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile new adapter
        run: python -m py_compile src/assistx/fleet_hardware_preview.py src/assistx/fleet_hardware_inspection.py
      - name: Lint changed files
        run: |
          ruff check src/assistx/fleet_hardware_preview.py src/assistx/fleet_hardware_inspection.py src/assistx/api_router.py tests/test_fleet_hardware_preview.py tests/test_fleet_hardware_inspection.py tests/test_fleet_receipt_lab_guard.py tests/test_fleet_hardware_route_smoke.py
      - name: Run isolated synthetic preview contract
        run: |
          python -m pytest -q tests/test_fleet_hardware_preview.py tests/test_fleet_hardware_inspection.py tests/test_fleet_receipt_lab_guard.py
      - name: Browser-side contract (no npm dependencies)
        run: |
          node --check static/js/fleet_hardware_preview.js
          node --check static/js/fleet_trace_evidence.js
          node --check static/js/traces.js
          node --test tests/ui/fleet_hardware_evidence.test.cjs
      - name: Validate full AssistX route and authentication on complete CI environment
        run: python -m pytest -q tests/test_fleet_hardware_route_smoke.py
