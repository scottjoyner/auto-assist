name: LFM3 signed private canary (NO Task admission)

on:
  pull_request:
    paths:
      - scripts/lfm3_signed_private_canary.py
      - scripts/lfm3_signed_canary_live_witness.py
      - tests/test_lfm3_signed_private_canary.py
      - .github/workflows/lfm3-signed-private-canary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-denial-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source with no retained git credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Install only pytest
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Synthetic signed route and malicious payload denials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m ast scripts/lfm3_signed_private_canary.py > /dev/null
          python -m ast scripts/lfm3_signed_canary_live_witness.py > /dev/null
          python -m pytest --noconftest -q -p no:cacheprovider tests/test_lfm3_signed_private_canary.py
