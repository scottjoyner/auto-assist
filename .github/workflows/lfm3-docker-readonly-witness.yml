name: LFM3 Docker-private read-only witness (HOLD)

on:
  pull_request:
    paths:
      - scripts/lfm3_docker_readonly_witness.py
      - tests/test_lfm3_docker_readonly_witness.py
      - .github/workflows/lfm3-docker-readonly-witness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-denial-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out untrusted source without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Install standalone test harness
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Assert no inference gateway and no Task admission
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m ast scripts/lfm3_docker_readonly_witness.py > /dev/null
          python -m pytest --noconftest -q -p no:cacheprovider tests/test_lfm3_docker_readonly_witness.py
