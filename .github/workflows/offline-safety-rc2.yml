name: AssistX offline safety RC2 (no hosted provider)
on:
  pull_request:
    paths:
      - '.github/workflows/offline-safety-rc2.yml'
      - 'scripts/verify_offline_safety_rc2.sh'
      - 'src/assistx/contracts/schemas/repository_source_binding.py'
      - 'src/assistx/llm/client.py'
      - 'src/assistx/intent_orchestrator.py'
      - 'tests/test_repository_source_binding*.py'
      - 'tests/test_llm_output_integrity.py'
      - 'tests/test_system_one_receipt.py'
      - 'tests/test_workbench_ui.py'
      - 'scripts/free_subagent_supervisor.py'
      - 'tests/test_free_subagent_supervisor.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-safety-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASSISTX_RUNTIME_PROFILE: test
      ASSISTX_DEPENDENCY_MODE: compat
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
      BASIC_AUTH_USER: offline-ci-operator
      BASIC_AUTH_PASS: synthetic-ci-fixture-not-a-real-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: bash scripts/verify_offline_safety_rc2.sh
      - name: Authenticated workbench rendering + invalid-password denial
        run: python -m pytest --noconftest -q tests/test_workbench_ui.py
