name: hermes-synthetic-writer-db

on:
  pull_request:
    paths:
      - "src/assistx/api.py"
      - "src/assistx/neo4j_client.py"
      - "tests/test_hermes_ticket_allocation_exclusion.py"
      - "tests/hermes_ticket_allocation_disposable_neo4j.py"
      - "tests/test_hermes_claim_replay_owner_exclusion.py"
      - "tests/hermes_claim_replay_disposable_neo4j.py"
      - "src/assistx/hermes_source_generation_research.py"
      - "tests/test_hermes_source_generation_research.py"
      - "tests/hermes_generation_serialization_disposable_neo4j.py"
      - "src/assistx/hermes_claim_census.py"
      - "tests/test_hermes_claim_census.py"
      - "tests/hermes_census_history_disposable_neo4j.py"
      - "src/assistx/passive_claims.py"
      - "src/assistx/voice_routes.py"
      - "src/assistx/intent_orchestrator.py"
      - "tests/hermes_owner_guard_disposable_neo4j.py"
      - ".github/workflows/hermes-synthetic-writer-db.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-owner-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: none
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
        ports:
          - 7687:7687
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned major-version Neo4j driver
        run: python -m pip install "neo4j>=5.26,<6"
      - name: Verify historical Hermes claim census omissions fail closed
        env:
          HERMES_DISPOSABLE_NEO4J: synthetic-ci-only
        run: python tests/hermes_census_history_disposable_neo4j.py
      - name: Verify candidate global generation transaction serialization (HOLD)
        env:
          HERMES_DISPOSABLE_NEO4J: synthetic-ci-only
        run: python tests/hermes_generation_serialization_disposable_neo4j.py
      - name: Verify ticket upsert and allocation fencing (synthetic Neo4j)
        env:
          HERMES_DISPOSABLE_NEO4J: synthetic-ci-only
        run: python tests/hermes_ticket_allocation_disposable_neo4j.py
      - name: Verify Hermes claim/replay admission with real disposable Neo4j
        env:
          HERMES_DISPOSABLE_NEO4J: synthetic-ci-only
        run: python tests/hermes_claim_replay_disposable_neo4j.py
      - name: Verify disposable Task owner guards (no production access)
        env:
          HERMES_DISPOSABLE_NEO4J: synthetic-ci-only
        run: python tests/hermes_owner_guard_disposable_neo4j.py
