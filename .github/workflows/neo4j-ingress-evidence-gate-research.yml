name: Neo4j ingress evidence gate (research HOLD)
on:
  pull_request:
    branches:
      - main
      - research/graph-principal-gate-20261103
    paths:
      - scripts/read_only_neo4j_ingress_gate.py
      - tests/test_read_only_neo4j_ingress_gate.py
      - docs/research/NEO4J_INGRESS_EVIDENCE_HOLD_20261103.md
      - .github/workflows/neo4j-ingress-evidence-gate-research.yml
  workflow_dispatch:
jobs:
  source-image-pin-and-network-denials:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated source test requirements
        run: python -m pip install pytest ruff
      - name: Compile and lint research ingress source
        run: |
          python3 -m py_compile scripts/read_only_neo4j_ingress_gate.py \
            tests/test_read_only_neo4j_ingress_gate.py
          python3 -m ruff check --ignore I001,E501,UP012,UP018,UP035,UP037,UP045 \
            scripts/read_only_neo4j_ingress_gate.py \
            tests/test_read_only_neo4j_ingress_gate.py
      - name: Prove immutable image pin and fail-closed runtime binding census
        run: |
          python3 -m pytest --noconftest -q \
            tests/test_read_only_neo4j_ingress_gate.py
  disposable-neo4j-writer-and-recovery-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated project test requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Physical existing graph security and recovery tests (no production graph)
        env:
          TEST_NEO4J_IMAGE: neo4j:5-enterprise
        run: |
          python3 -m pytest -q tests/test_review_orphan_audit_neo4j.py \
            tests/test_review_atomic_approval_neo4j.py \
            tests/test_operator_review_transition_neo4j.py \
            tests/test_legacy_task_writer_guard_neo4j.py \
            tests/test_legacy_task_completion_neo4j.py \
            tests/test_legacy_task_maintenance_neo4j.py \
            tests/test_legacy_intent_cancel_neo4j.py \
            tests/test_scoped_machine_claim_neo4j.py \
            tests/test_scoped_machine_execution_neo4j.py \
            tests/test_recovery_canary.py
