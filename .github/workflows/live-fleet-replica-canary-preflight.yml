name: Live Fleet Replica Canary Preflight

on:
  push:
    paths:
      - ".github/workflows/live-fleet-replica-canary-preflight.yml"
      - "scripts/bootstrap-x1-370-canary-workspace.sh"
      - "scripts/bootstrap-x1-370-canary-runner.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x1-370-preflight:
    runs-on: [self-hosted, Linux, X64, x1-370, assistx-canary]
    timeout-minutes: 10
    env:
      EXPECTED_HOST: x1-370
      ASSISTX_RUNTIME_SHA: aad657bbf4fff5bec2080ada07f5a4ad02292743
      AUTO_ROUTER_RUNTIME_SHA: 1fbb9726de46a30c0c91616c65c04dc1f35845a6
      ASSISTX_RUNTIME_WORKTREE: /home/scott/git/auto-assist-canary-runtime
      AUTO_ROUTER_RUNTIME_WORKTREE: /home/scott/git/auto-router-canary-runtime
    steps:
      - uses: actions/checkout@v4

      - name: Guard exact execution host and pinned worktrees
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "$EXPECTED_HOST"
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"

          for cmd in tailscale docker curl python3 git sha256sum; do
            command -v "$cmd" >/dev/null
          done

          test -d "$ASSISTX_RUNTIME_WORKTREE/.git" -o -f "$ASSISTX_RUNTIME_WORKTREE/.git"
          test -d "$AUTO_ROUTER_RUNTIME_WORKTREE/.git" -o -f "$AUTO_ROUTER_RUNTIME_WORKTREE/.git"

          test "$(git -C "$ASSISTX_RUNTIME_WORKTREE" rev-parse HEAD)" = "$ASSISTX_RUNTIME_SHA"
          test "$(git -C "$AUTO_ROUTER_RUNTIME_WORKTREE" rev-parse HEAD)" = "$AUTO_ROUTER_RUNTIME_SHA"
          test -z "$(git -C "$ASSISTX_RUNTIME_WORKTREE" status --porcelain)"
          test -z "$(git -C "$AUTO_ROUTER_RUNTIME_WORKTREE" status --porcelain)"

          tailscale status --json > /tmp/tailscale-status.json
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/tailscale-status.json"))
          self_node=data.get("Self") or {}
          dns=(self_node.get("DNSName") or "").rstrip(".")
          if not dns:
              raise SystemExit("tailscale Self.DNSName missing")
          print(dns)
          open("/tmp/tailscale-dns.txt","w").write(dns+"\n")
          PY

      - name: Verify live authority code matches pinned runtime worktrees
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/live-fleet-replica-preflight

          assistx_container="$(
            docker ps --format '{{.Names}}' |
              grep -E '(^|[-_])assistx-api($|[-_])|^assistx-api$' |
              head -n1 || true
          )"
          router_container="$(
            docker ps --format '{{.Names}}' |
              grep -E '(^|[-_])auto-router($|[-_])|^auto-router$' |
              head -n1 || true
          )"

          test -n "$assistx_container"
          test -n "$router_container"

          local_assistx_hash="$(
            sha256sum "$ASSISTX_RUNTIME_WORKTREE/src/assistx/mobile_agent_routes.py" |
              awk '{print $1}'
          )"
          live_assistx_hash="$(
            docker exec "$assistx_container" python -c               'import hashlib; print(hashlib.sha256(open("/app/src/assistx/mobile_agent_routes.py","rb").read()).hexdigest())'
          )"
          test "$local_assistx_hash" = "$live_assistx_hash"

          router_pkg="$(
            docker exec "$router_container" python -c               'import auto_router,pathlib; print(pathlib.Path(auto_router.__file__).resolve().parent)'
          )"

          for rel in policy.py route_events.py; do
            expected="$(
              sha256sum "$AUTO_ROUTER_RUNTIME_WORKTREE/src/auto_router/$rel" |
                awk '{print $1}'
            )"
            actual="$(
              docker exec "$router_container" python -c                 "import hashlib; print(hashlib.sha256(open('$router_pkg/$rel','rb').read()).hexdigest())"
            )"
            test "$expected" = "$actual"
            printf '%s %s\n' "$rel" "$actual"               >> artifacts/live-fleet-replica-preflight/auto-router-authority-hashes.txt
          done

          printf '%s\n' "$live_assistx_hash"             > artifacts/live-fleet-replica-preflight/assistx-mobile-route.sha256

          # Because AssistX bind-mounts /app/src, ensure the process was started
          # after the authority file's current mtime; otherwise a Python process
          # could still have older module code loaded despite matching files.
          file_mtime="$(
            docker exec "$assistx_container" stat -c %Y /app/src/assistx/mobile_agent_routes.py
          )"
          container_started="$(
            docker inspect --format '{{.State.StartedAt}}' "$assistx_container"
          )"
          python3 - "$file_mtime" "$container_started" <<'PY'
          import datetime, sys
          mtime=int(sys.argv[1])
          started=datetime.datetime.fromisoformat(sys.argv[2].replace("Z","+00:00")).timestamp()
          if started < mtime:
              raise SystemExit(
                  "assistx-api started before current mobile_agent_routes.py mtime; "
                  "restart/redeploy is required for exact runtime proof"
              )
          PY

          echo "$assistx_container"             > artifacts/live-fleet-replica-preflight/assistx-container.txt
          echo "$router_container"             > artifacts/live-fleet-replica-preflight/auto-router-container.txt

      - name: Capture read-only live topology preflight
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/live-fleet-replica-preflight"
          assistx_container="$(cat "$out/assistx-container.txt")"
          router_container="$(cat "$out/auto-router-container.txt")"

          docker exec "$assistx_container" sh -lc             'curl -fsS -u "$BASIC_AUTH_USER:$BASIC_AUTH_PASS" http://127.0.0.1:8000/api/v1/runtime/catalog'             > "$out/runtime-catalog.json"

          router_data_source="$(
            docker inspect "$router_container" |
              python3 -c '
          import json,sys
          obj=json.load(sys.stdin)[0]
          matches=[m.get("Source") for m in obj.get("Mounts",[]) if m.get("Destination")=="/data"]
          print(matches[0] if len(matches)==1 else "")
          '
          )"
          test -n "$router_data_source"
          router_db="${router_data_source%/}/router.sqlite3"
          test -r "$router_db"
          echo "$router_db" > "$out/router-db-path.txt"

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          out = Path("artifacts/live-fleet-replica-preflight")
          catalog = json.loads((out / "runtime-catalog.json").read_text())
          models = catalog.get("models") if isinstance(catalog, dict) else None
          if not isinstance(models, list):
              raise SystemExit("runtime catalog missing models")

          replicated = []
          for row in models:
              if not isinstance(row, dict) or row.get("state") != "ready":
                  continue
              try:
                  count = int(row.get("ready_runtime_count") or 0)
              except (TypeError, ValueError):
                  continue
              if count < 2:
                  continue
              replicated.append(
                  {
                      "model_handle": row.get("model_handle"),
                      "display_name": row.get("display_name"),
                      "ready_runtime_count": count,
                      "state": row.get("state"),
                  }
              )

          summary = {
              "host": os.uname().nodename,
              "tailscale_dns": Path("/tmp/tailscale-dns.txt").read_text().strip(),
              "assistx_runtime_sha": os.environ["ASSISTX_RUNTIME_SHA"],
              "auto_router_runtime_sha": os.environ["AUTO_ROUTER_RUNTIME_SHA"],
              "replicated_ready_models": replicated,
              "replicated_ready_model_count": len(replicated),
              "preflight": "PASS" if replicated else "NO_REPLICATED_READY_MODEL",
          }
          (out / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          if not replicated:
              raise SystemExit("no ready mobile catalog model has >=2 replicas")
          PY

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-fleet-replica-preflight-${{ github.sha }}
          path: artifacts/live-fleet-replica-preflight/
          if-no-files-found: warn
          retention-days: 14
