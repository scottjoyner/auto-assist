name: Fleet projection read-only preflight (no admission)

on:
  pull_request:
    paths:
      - scripts/fleet-projection-readonly-preflight.py
      - tests/test_fleet_projection_readonly_preflight.py
      - scripts/fleet-local-capacity-nonadmitting-canary.py
      - tests/test_fleet_local_capacity_nonadmitting_canary.py
      - .github/workflows/fleet-projection-readonly-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out without retained credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Install narrow test harness only
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Synthetic graph and local capacity canary must never admit
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile scripts/fleet-projection-readonly-preflight.py tests/test_fleet_projection_readonly_preflight.py scripts/fleet-local-capacity-nonadmitting-canary.py tests/test_fleet_local_capacity_nonadmitting_canary.py
          python -m pytest --noconftest -q -p no:cacheprovider tests/test_fleet_projection_readonly_preflight.py tests/test_fleet_local_capacity_nonadmitting_canary.py
