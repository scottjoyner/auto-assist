name: rc2-ingress-peer-gate

on:
  pull_request:
    paths:
      - "scripts/rc2-ingress-peer-gate.py"
      - "tests/test_rc2_ingress_peer_gate.py"
      - ".github/workflows/rc2-ingress-peer-gate.yml"

permissions:
  contents: read

jobs:
  synthetic-ingress-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify ingress fail-closed projection without fleet access
        run: |
          python -m pip install pytest
          python -m py_compile scripts/rc2-ingress-peer-gate.py tests/test_rc2_ingress_peer_gate.py
          python -m pytest --noconftest -q tests/test_rc2_ingress_peer_gate.py
