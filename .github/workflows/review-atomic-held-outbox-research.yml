name: Atomic held review approval (research HOLD)
on:
  pull_request:
    branches:
      - main
      - research/operator-review-cas-20261103
    paths:
      - src/assistx/review_atomic_approval.py
      - tests/test_review_atomic_approval.py
      - tests/test_review_atomic_approval_neo4j.py
      - docs/research/REVIEW_ATOMIC_HELD_OUTBOX_20261103.md
      - .github/workflows/review-atomic-held-outbox-research.yml
  workflow_dispatch:
jobs:
  isolated-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Minimal source test tools
        run: python -m pip install pytest ruff
      - name: Compile and lint research module
        run: |
          python -m py_compile src/assistx/review_atomic_approval.py tests/test_review_atomic_approval.py tests/test_review_atomic_approval_neo4j.py
          ruff check --ignore I001,E501,UP012,UP018,UP035,UP037,UP045 src/assistx/review_atomic_approval.py tests/test_review_atomic_approval.py tests/test_review_atomic_approval_neo4j.py
      - name: Synthetic pure-source fail-closed tests
        run: python -m pytest --noconftest -q tests/test_review_atomic_approval.py
  disposable-neo4j-atomic-outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated project test requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Real disposable graph atomicity, lock, concurrent approval and recovery
        env:
          TEST_NEO4J_IMAGE: neo4j:5-enterprise
        run: |
          python -m pytest -q tests/test_review_atomic_approval_neo4j.py \
            tests/test_operator_review_transition_neo4j.py \
            tests/test_legacy_task_writer_guard_neo4j.py \
            tests/test_legacy_task_completion_neo4j.py \
            tests/test_legacy_task_maintenance_neo4j.py \
            tests/test_legacy_intent_cancel_neo4j.py \
            tests/test_scoped_machine_claim_neo4j.py \
            tests/test_scoped_machine_execution_neo4j.py \
            tests/test_recovery_canary.py
