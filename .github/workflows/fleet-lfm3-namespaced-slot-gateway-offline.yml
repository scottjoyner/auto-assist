name: Fleet co-namespaced LFM3 slot gateway (synthetic, HOLD)

on:
  pull_request:
    paths:
      - scripts/fleet_lfm3_namespaced_slot_gateway.py
      - scripts/fleet_lfm3_namespaced_operator_probe.py
      - tests/test_fleet_lfm3_namespaced_slot_gateway.py
      - docs/FLEET_LFM3_CO_NAMESPACE_GATEWAY_20261108.md
      - .github/workflows/fleet-lfm3-namespaced-slot-gateway-offline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-namespace-fence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code with no retained credential
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install test runner only
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Verify source and synthetic denials only
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src:scripts
        run: |
          python -m py_compile scripts/fleet_lfm3_namespaced_slot_gateway.py scripts/fleet_lfm3_namespaced_operator_probe.py tests/test_fleet_lfm3_namespaced_slot_gateway.py
          python -m pytest --noconftest -q -p no:cacheprovider tests/test_fleet_lfm3_namespaced_slot_gateway.py tests/test_fleet_lfm3_signed_slot_bridge_canary.py tests/test_fleet_resource_slot_ledger.py
