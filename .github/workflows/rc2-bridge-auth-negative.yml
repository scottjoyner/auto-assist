name: rc2-bridge-auth-negative

on:
  pull_request:
    paths:
      - "scripts/run_rc2_bridge_auth_isolated.py"
      - "tests/test_rc2_bridge_auth_disposable_guard.py"
      - "src/assistx/trusted_gateway_identity_contract.py"
      - "src/assistx/gateway_replay_fence_research.py"
      - "src/assistx/signed_observation_asgi_research.py"
      - "tests/test_signed_observation_asgi_research.py"
      - "scripts/run_gateway_real_redis_replay_isolated.py"
      - "tests/test_gateway_replay_fence_research.py"
      - "tests/test_gateway_real_redis_replay_guard.py"
      - ".github/workflows/rc2-bridge-auth-negative.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-docker-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run no-Docker synthetic guards
        run: |
          python -m pip install pytest mypy "cryptography>=43,<46" "fastapi==0.115.0" "httpx==0.27.2"
          python -m mypy src/assistx/signed_observation_asgi_research.py --ignore-missing-imports --follow-imports=skip
          python -m py_compile scripts/run_rc2_bridge_auth_isolated.py tests/test_rc2_bridge_auth_disposable_guard.py src/assistx/gateway_replay_fence_research.py scripts/run_gateway_real_redis_replay_isolated.py src/assistx/signed_observation_asgi_research.py tests/test_signed_observation_asgi_research.py
          python -m pytest --noconftest -q tests/test_rc2_bridge_auth_disposable_guard.py tests/test_trusted_gateway_identity_contract.py tests/test_gateway_replay_fence_research.py tests/test_gateway_real_redis_replay_guard.py tests/test_signed_observation_asgi_research.py
