name: K2 independent witness verifier (offline research)

on:
  push:
    branches:
      - research/k2-independent-witness-verifier-20261102
      - research/k2-witness-boot-binding-20261102
      - research/k2-current-process-identity-20261102
      - research/k2-authenticated-issuer-20261103
      - research/k2-independent-custody-readiness-20261103
      - research/k2-custody-handoff-20261103
      - research/k2-witness-collection-stages-20261103
      - research/k2-observer-security-boundary-20261103
      - research/k2-model-catalog-residency-20261103
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test-only packages
        run: python -m pip install 'cryptography==45.0.7' 'pytest==8.4.2' 'ruff==0.13.3'
      - name: Compile observer, signed verifier and nonce fixtures
        run: |
          python -m py_compile scripts/verify-x1-k2-signed-witness-offline.py \
            scripts/inspect-x1-k2-physical-witness-readonly.py \
            tests/test_x1_k2_signed_witness_offline.py \
            tests/test_x1_k2_physical_witness.py \
            tests/test_k2_challenge_spend_fixture.py \
            tests/fixtures/k2_challenge_spend_fixture.py \
            tests/test_k2_external_highwater_fixture.py \
            tests/fixtures/k2_external_highwater_fixture.py \
            tests/fixtures/k2_authenticated_issuer_fixture.py \
            tests/test_k2_authenticated_issuer_fixture.py \
            scripts/inspect-k2-witness-custody-readiness-readonly.py \
            tests/test_k2_witness_custody_readiness_readonly.py \
            scripts/verify-k2-custody-handoff-offline.py \
            tests/test_k2_custody_handoff_offline.py \
            scripts/inspect-k2-observer-namespace-readonly.py \
            tests/test_k2_observer_namespace_readonly.py \
            scripts/inspect-k2-catalog-residency-readonly.py \
            tests/test_k2_catalog_residency_readonly.py
      - name: Strict lint observer, verifier and nonce replay fixture
        run: |
          ruff check scripts/verify-x1-k2-signed-witness-offline.py \
            scripts/inspect-x1-k2-physical-witness-readonly.py \
            tests/test_x1_k2_signed_witness_offline.py \
            tests/test_x1_k2_physical_witness.py \
            tests/test_k2_challenge_spend_fixture.py \
            tests/fixtures/k2_challenge_spend_fixture.py \
            tests/test_k2_external_highwater_fixture.py \
            tests/fixtures/k2_external_highwater_fixture.py \
            tests/fixtures/k2_authenticated_issuer_fixture.py \
            tests/test_k2_authenticated_issuer_fixture.py \
            scripts/inspect-k2-witness-custody-readiness-readonly.py \
            tests/test_k2_witness_custody_readiness_readonly.py \
            scripts/verify-k2-custody-handoff-offline.py \
            tests/test_k2_custody_handoff_offline.py \
            scripts/inspect-k2-observer-namespace-readonly.py \
            tests/test_k2_observer_namespace_readonly.py \
            scripts/inspect-k2-catalog-residency-readonly.py \
            tests/test_k2_catalog_residency_readonly.py
      - name: Run 275 offline physical, catalog, crypto and custody tests
        run: |
          python -m pytest --noconftest -q \
            tests/test_x1_k2_physical_witness.py \
            tests/test_x1_k2_signed_witness_offline.py \
            tests/test_k2_challenge_spend_fixture.py \
            tests/test_k2_external_highwater_fixture.py \
            tests/test_k2_authenticated_issuer_fixture.py \
            scripts/inspect-k2-witness-custody-readiness-readonly.py \
            tests/test_k2_witness_custody_readiness_readonly.py \
            scripts/verify-k2-custody-handoff-offline.py \
            tests/test_k2_custody_handoff_offline.py \
            scripts/inspect-k2-observer-namespace-readonly.py \
            tests/test_k2_observer_namespace_readonly.py \
            scripts/inspect-k2-catalog-residency-readonly.py \
            tests/test_k2_catalog_residency_readonly.py
      - name: Check no-production-trust configuration
        run: |
          grep -F 'TRUSTED_WITNESS_KEY_SHA256 = ""' scripts/verify-x1-k2-signed-witness-offline.py
          grep -F 'APPROVED_RUNTIME_EXECUTABLE_SHA256 = ""' scripts/verify-x1-k2-signed-witness-offline.py
          grep -F 'APPROVED_PROXY_EXECUTABLE_SHA256 = ""' scripts/verify-x1-k2-signed-witness-offline.py
          grep -F 'TRUSTED_CURRENT_BOOT_ID_SHA256 = ""' scripts/verify-x1-k2-signed-witness-offline.py
          grep -F 'TRUSTED_CURRENT_PROCESS_IDENTITY = None' scripts/verify-x1-k2-signed-witness-offline.py
          grep -F 'APPROVED_OPERATOR_PUBLIC_KEY_SHA256 = ""' scripts/verify-k2-custody-handoff-offline.py
          grep -F 'APPROVED_CUSTODIAN_PUBLIC_KEY_SHA256 = ""' scripts/verify-k2-custody-handoff-offline.py
